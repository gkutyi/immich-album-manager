<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<title>Synchronisationsbericht</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    margin:30px;
}

.card{

    background:white;

    border-radius:8px;

    padding:20px;

    box-shadow:0 0 10px #bbb;

}

table{

    width:100%;

    border-collapse:collapse;

    margin-bottom:30px;

}

th{

    background:#efefef;

}

th,td{

    border:1px solid #ccc;

    padding:8px;

}

h2{

    margin-top:0;

}

.created{

    color:green;

}

.updated{

    color:#0066cc;

}

.skipped{

    color:#888;

}

.error{

    color:red;

}

.button{

    display:inline-block;

    margin-top:20px;

    padding:10px 20px;

    background:#1976d2;

    color:white;

    text-decoration:none;

    border-radius:5px;

}

.button:hover{

    background:#1259a7;

}

</style>

</head>

<body>

<div class="card">

<h2>Synchronisationsbericht</h2>

<p>

<b>07.08.2026 07:37:27</b>

</p>

<hr>

<table>

<tr>

<th>Neue Alben</th>

<th>Aktualisiert</th>

<th>Übersprungen</th>

<th>Fehler</th>

</tr>

<tr>

<td class="created">0</td>

<td class="updated">0</td>

<td class="skipped">0</td>

<td class="error">0</td>

</tr>

</table>

<h3 class="created">Neue Alben</h3>

<table>

<tr>
    <th>Album</th>
    <th>Assets</th>
</tr>



<tr>

<td colspan="2">

Keine neuen Alben.

</td>

</tr>



</table>

<h3 class="updated">Aktualisierte Alben</h3>

<table>

<tr>
    <th>Album</th>
    <th>Neue Assets</th>
</tr>



<tr>

<td colspan="2">

Keine Änderungen.

</td>

</tr>



</table>

<h3 class="skipped">Übersprungene Alben</h3>

<table>

<tr>
    <th>Album</th>
    <th>Grund</th>
</tr>



<tr>

<td colspan="2">

Keine.

</td>

</tr>



</table>

<h3 class="error">Fehler</h3>

<table>

<tr>
    <th>Album</th>
    <th>Fehler</th>
</tr>



<tr>

<td colspan="2">

Keine Fehler.

</td>

</tr>



</table>

<hr>

<a class="button" href="/">
    Zur Startseite
</a>

</div>

</body>

</html>
